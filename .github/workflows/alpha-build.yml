name: alpha-build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/alpha-build.yml"
      - "addons/resonant-browser-host/**"
      - "browser-first/**"
      - "docs/**"
      - "package-lock.json"
      - "package.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/alpha-build.yml"
      - "addons/resonant-browser-host/**"
      - "browser-first/**"
      - "docs/**"
      - "package-lock.json"
      - "package.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"

jobs:
  build-alpha:
    name: Build Chrome extension alpha
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Audit app dependencies
        run: npm audit --audit-level=high

      - name: Install browser host dependencies
        run: npm ci --prefix addons/resonant-browser-host

      - name: Audit browser host dependencies
        run: npm audit --prefix addons/resonant-browser-host --audit-level=high

      - name: Typecheck and build app
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run browser host tests
        env:
          RESONANTOS_BROWSER_HOST_CHANNEL: chrome
        run: npm run test:browser-host

      - name: Run browser-first extension tests
        run: npm run test:browser-first

      - name: Run Living Archive memory service tests
        run: npm run test:living-archive-memory-service

      - name: Run Living Archive MCP tests
        run: npm run test:living-archive-mcp

      - name: Run health checks
        run: npm run test:health

      - name: Run engineer runner tests
        run: npm run test:engineer-runner

      - name: Run security pipeline
        run: node scripts/security-pipeline/run-check.mjs

      - name: Package Chrome extension
        run: |
          cd browser-first/resonantos-side-panel-extension
          zip -r ../../resonantos-side-panel-extension.zip . -x "*.DS_Store" "src/bridge-config.generated.js"

      - name: Run pre-release artifact scan
        run: npm run pre-release:scan

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: resonantos-side-panel-extension
          path: resonantos-side-panel-extension.zip
          retention-days: 14

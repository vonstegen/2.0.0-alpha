name: project-issue-sync

on:
  issues:
    types: [opened, reopened, edited, labeled, unlabeled, closed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed, labeled, unlabeled]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log planned Project/label changes without writing them."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync Project 2 release fields and issue labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Check Project token
        id: project-token
        env:
          HAS_PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN != '' }}
        run: |
          if [ "$HAS_PROJECT_SYNC_TOKEN" != "true" ]; then
            echo "::warning::PROJECT_SYNC_TOKEN is not configured. Organization Project 2 synchronization cannot run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Project token
        if: steps.project-token.outputs.configured != 'true'
        run: |
          echo "::error::PROJECT_SYNC_TOKEN is required for repository-owned Project 2 synchronization."
          exit 1

      - name: Sync project and labels
        if: steps.project-token.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then
            args="--dry-run"
          fi
          node scripts/sync-project-issue-labels.mjs $args

name: verify

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check + SDK tests + governed-runtime drills + docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: SDK tests (vitest)
        run: npx vitest run src

      - name: Governed-runtime drills (7-provider parity + Ground-0 recovery)
        run: node scripts/governed-runtime-drills.mjs

      - name: Documentation contract validation
        run: node scripts/validate-docs.mjs

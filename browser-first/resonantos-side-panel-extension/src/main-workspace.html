<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ResonantOS</title>
    <link rel="stylesheet" href="./main-workspace.css" />
  </head>
  <body>
    <main class="workspace-shell" aria-label="ResonantOS main workspace">
      <aside class="workspace-rail" aria-label="ResonantOS navigation">
        <header class="rail-header">
          <div class="brand-lockup">
            <div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c2-6 6-6 9 0c3 6 7 6 11 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="5" r="1.8" fill="currentColor"/></svg></div>
            <strong>ResonantOS</strong>
          </div>
          <button id="rail-toggle" type="button" class="rail-icon-button" title="Collapse sidebar" aria-label="Collapse sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14"/><path d="M4 5h16v14H4z"/></svg>
          </button>
        </header>

        <nav class="rail-tabs" aria-label="Main sections">
          <section class="rail-tab" data-tab="chat">
            <div class="rail-tab-header">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>Chat</span>
            </div>
            <div id="rail-tab-chat-items" class="rail-tab-items">
              <button id="rail-new-chat" type="button" class="rail-item">
                <span>New chat</span>
              </button>
            </div>
          </section>

          <section class="rail-tab" data-tab="workspaces">
            <button type="button" class="rail-tab-toggle" aria-expanded="false" aria-controls="rail-tab-workspaces-items">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18"/><path d="M5 9v11"/><path d="M19 9v11"/><path d="M5 14h14"/></svg>
              <span>Workspaces</span>
              <svg class="rail-tab-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="rail-tab-workspaces-items" class="rail-tab-items" hidden>
              <section class="rail-section" aria-label="Projects">
                <div class="rail-section-row"><h2>Projects</h2><button id="rail-new-project" type="button">New</button></div>
                <ol id="rail-project-list" class="rail-project-list"></ol>
              </section>
              <section class="rail-section rail-recents" aria-label="Recent chats" data-project-id="">
                <div class="rail-section-row"><h2>Chats</h2><button id="rail-clear-search" type="button" hidden>Clear</button></div>
                <ol id="rail-chat-list" class="rail-chat-list"></ol>
              </section>
            </div>
          </section>

          <section class="rail-tab" data-tab="search">
            <button type="button" class="rail-tab-toggle" aria-expanded="false" aria-controls="rail-tab-search-items">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
              <span>Search</span>
              <svg class="rail-tab-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="rail-tab-search-items" class="rail-tab-items" hidden>
              <div class="rail-search-box">
                <input id="rail-search-input" type="search" placeholder="Search ResonantOS" aria-label="Search ResonantOS" />
              </div>
            </div>
          </section>


          <section class="rail-tab" data-tab="controls">
            <button type="button" class="rail-tab-toggle" aria-expanded="false" aria-controls="rail-tab-controls-items">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg>
              <span>Controls</span>
              <svg class="rail-tab-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="rail-tab-controls-items" class="rail-tab-items" hidden>
              <button id="dock-tab-control" type="button" class="rail-item" aria-expanded="false" aria-controls="dock-popout" aria-label="Agent Control">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/></svg>
                <span>Control</span>
                <span id="dock-dot-control" class="dock-tab-dot" hidden aria-hidden="true"></span>
              </button>
              <button id="dock-tab-jobs" type="button" class="rail-item" aria-expanded="false" aria-controls="dock-popout">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v2H9z"/><path d="M4 4h16v2H4z"/><path d="M5 6h14v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/></svg>
                <span>Jobs</span>
                <span id="dock-dot-jobs" class="dock-tab-dot" hidden aria-hidden="true"></span>
              </button>
              <button id="dock-tab-permissions" type="button" class="rail-item" aria-expanded="false" aria-controls="dock-popout">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></svg>
                <span>Permissions</span>
                <span id="dock-dot-permissions" class="dock-tab-dot" hidden aria-hidden="true"></span>
              </button>
            </div>
          </section>

          <section class="rail-tab" data-tab="resources">
            <button type="button" class="rail-tab-toggle" aria-expanded="false" aria-controls="rail-tab-resources-items">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
              <span>Resources</span>
              <svg class="rail-tab-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="rail-tab-resources-items" class="rail-tab-items" hidden>
              <button type="button" class="rail-item" data-workspace="artifacts">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z"/><path d="M8 9h8"/><path d="M8 13h5"/></svg>
                <span>Artifacts</span>
              </button>
              <button type="button" class="rail-item" data-workspace="memory">
                <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
                <span>Memory</span>
              </button>
            </div>
          </section>
          <section class="rail-tab" data-tab="addons">
            <button type="button" class="rail-tab-toggle" aria-expanded="false" aria-controls="rail-tab-addons-items">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
              <span>Add-ons</span>
              <svg class="rail-tab-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="rail-tab-addons-items" class="rail-tab-items" hidden>
              <button type="button" class="rail-item" data-workspace="addons" data-addons-view="registry">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
                <span>Registry</span>
              </button>
              <button type="button" class="rail-item" data-workspace="addons" data-addons-view="installed">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                <span>My Add-ons</span>
              </button>
              <button type="button" class="rail-item" data-workspace="addons" data-addons-view="discover">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <span>Discover</span>
              </button>
              <button type="button" class="rail-item" data-workspace="addons" data-addons-view="sdk">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6"/><path d="m16 6 6 6-6 6"/></svg>
                <span>SDK</span>
              </button>
            </div>
          </section>

        </nav>

        <!-- Projects + Chats moved to the top-bar "Chats" tab (see #dock-popout). -->

        <footer class="rail-footer">
          <button type="button" class="rail-tab-toggle" data-workspace="settings" data-settings-section="overview" aria-label="Open settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>Settings</span>
          </button>
          <button type="button" class="rail-user-card" data-workspace="settings" data-settings-section="profile">
            <span id="rail-avatar" class="rail-avatar">R</span>
            <span>
              <strong id="rail-user-name">ResonantOS User</strong>
              <small id="rail-user-subtitle">Local sovereign profile</small>
            </span>
          </button>
          <small id="rail-version" class="rail-version" title="ResonantOS extension version">v0.2.0</small>
        </footer>
      </aside>

      <section class="answer-workspace" aria-label="Augmentor full-screen chat">

        <div class="answer-body">
        <section id="transcript" class="answer-thread" aria-live="polite"></section>
        <section id="dock-popout" class="dock-popout" aria-label="Browser panel" data-open="none" hidden>
          <div class="dock-popout-header">
            <strong id="dock-popout-title">Panel</strong>
            <button id="dock-popout-close" class="dock-popout-close" type="button" aria-label="Close panel">&#10005;</button>
          </div>
          <div id="dock-popout-body" class="dock-popout-body">
            <section id="dock-control-panel" class="dock-control-panel" aria-label="Agent Control" hidden>
              <div class="control-monitor-header">
                <div><span class="eyebrow">Agent Control</span><strong id="dock-control-title">No active browser task</strong></div>
                <span id="dock-control-status" class="control-status">idle</span>
              </div>
              <div id="dock-control-step-list" class="control-step-list"></div>
            </section>
            <section id="main-browser-jobs" class="main-browser-jobs" aria-label="Agent Control browser jobs" hidden></section>
            <section id="permission-manager-panel" class="permission-manager-panel" aria-label="Permission and consent manager" hidden>
              <div class="task-consent-header"><div><span class="eyebrow">Permissions</span><strong id="permission-manager-title">No stored browser grants</strong></div></div>
              <ol id="permission-manager-list" class="permission-manager-list"></ol>
            </section>
          </div>
        </section>
        </div>

        <form id="command-form" class="main-composer" aria-label="Ask Augmentor">
          <textarea id="command-input" rows="2" placeholder="Ask Augmentor anything"></textarea>
          <div id="attachment-strip" class="attachment-strip" hidden></div>
          <div class="composer-toolbar">
            <button id="attach-file" type="button" class="icon-button" title="Attach file" aria-label="Attach file">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </button>
            <input id="file-input" type="file" multiple hidden />
            <details class="composer-tools-menu">
              <summary aria-label="Open composer tools" title="Tools">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>
                <span>Tools</span>
              </summary>
              <div class="composer-tools-panel" aria-label="Composer tools">
                <button id="read-page" type="button" class="icon-button" title="Read current browser page" aria-label="Read current browser page">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                </button>
                <button id="save-intake" type="button" class="icon-button" title="Save current browser page to Living Archive intake" aria-label="Save current browser page to Living Archive intake">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h8V4"/><path d="M8 16h8"/></svg>
                </button>
                <button id="save-selection" type="button" class="icon-button" title="Save selected browser text to Living Archive intake" aria-label="Save selected browser text to Living Archive intake">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z"/><path d="M8 9h8"/><path d="M8 13h5"/><path d="m15 15 2 2 3-4"/></svg>
                </button>
                <button id="context-toggle" type="button" class="icon-button context-usage-button" title="Summarize current browser context" aria-label="Summarize current browser context">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 1 16 0"/><path d="M4 12h4"/><path d="M16 12h4"/><path d="M12 4v4"/><path d="M8.5 17.5 12 12l3.5 5.5"/></svg>
                </button>
                <button id="connection-line" type="button" class="connection-line" title="Connected to MiniMax M3 · Ready" aria-label="Connected to MiniMax M3 · Ready">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h4l2-7 4 14 2-7h4"/></svg>
                </button>
              </div>
            </details>
            <select id="model-select" class="model-select" aria-label="Connected model">
              <option value="__auto__">Auto route</option>
              <option value="MiniMax-M3">MiniMax M3</option>
              <option value="zai/glm-5.2">Z.AI GLM 5.2</option>
              <option value="gpt-5.5">GPT 5.5</option>
              <option value="gpt-5.4-mini">GPT 5.4 Mini</option>
              <option value="batiai/gemma4-e2b:q4">Gemma 4 2B</option>
            </select>
            <select id="thinking-depth" class="depth-select" aria-label="Thinking depth">
              <option value="minimal">Minimal</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
            <select id="regeneration-mode" class="regeneration-select" aria-label="Regenerate behavior">
              <option value="branch">Branch</option>
              <option value="overwrite">Overwrite</option>
            </select>
            <button id="dictate-button" type="button" class="icon-button muted" title="Start voice dictation" aria-label="Start voice dictation">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V7a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
            </button>
            <button id="context-meter" type="button" class="context-meter" title="Estimated conversation, attachment, and captured page context for this session." aria-label="Context usage 0 percent">
              <span class="context-meter-label">0%</span>
            </button>
            <button type="submit" class="send-button" aria-label="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
            </button>
          </div>
          <section id="context-popover" class="context-memory-popover" aria-label="Context memory map" hidden></section>
          <div id="composer-notice" class="composer-notice" role="status" aria-live="polite" hidden></div>
        </form>
      </section>
      <div id="rail-resize" class="rail-resize" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
    </main>
    <script src="./bridge-config.generated.js"></script>
    <script type="module" src="./main-workspace.js"></script>
  </body>
</html>

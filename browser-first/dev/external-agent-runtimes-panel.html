<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>External Agent Runtimes — Dev Panel</title>
  <style>
    :root { color-scheme: light dark; --bg: #0e1116; --fg: #e6edf3; --muted: #8b949e; --ok: #3fb950; --fail: #f85149; --na: #d29922; --card: #161b22; --border: #30363d; }
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 24px; }
    h1 { margin: 0 0 4px 0; font-size: 22px; }
    .subtitle { color: var(--muted); margin: 0 0 24px 0; }
    .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
    button { font: inherit; padding: 6px 12px; background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
    button:hover { background: var(--border); }
    .meta { color: var(--muted); font-size: 12px; }
    .addon { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .addon h2 { margin: 0 0 4px 0; font-size: 16px; }
    .addon .row { display: grid; grid-template-columns: 160px 1fr; gap: 8px; margin: 4px 0; font-size: 13px; }
    .addon .row .k { color: var(--muted); }
    .addon .row .v { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    .trigger { color: var(--ok); }
    .no-trigger { color: var(--muted); }
    .err { color: var(--fail); margin: 4px 0; font-size: 12px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; border: 1px solid var(--border); }
    .badge.tier-personal   { background: rgba(210,153,34,0.18); color: var(--na);  border-color: rgba(210,153,34,0.45); }
    .badge.tier-verified   { background: rgba(63,185,80,0.18); color: var(--ok);  border-color: rgba(63,185,80,0.45); }
    .badge.tier-approved   { background: rgba(63,185,80,0.22); color: var(--ok);  border-color: rgba(63,185,80,0.55); }
    .badge.tier-system     { background: rgba(110,118,129,0.30); color: var(--fg); border-color: rgba(110,118,129,0.55); }
    .badge.host-mediate    { background: rgba(63,185,80,0.18); color: var(--ok); border-color: rgba(63,185,80,0.45); }
    .badge.host-inline     { background: rgba(110,118,129,0.20); color: var(--muted); border-color: var(--border); }
    .worker-key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); word-break: break-all; border-left: 2px solid var(--border); padding-left: 8px; margin-top: 4px; }
    .worker-key .label { color: var(--muted); font-weight: 600; margin-right: 4px; }
  </style>
<body>
  <h1>External Agent Runtimes</h1>
  <p class="subtitle">Dev-only panel. Enumerates <code>examples/addons/*.json</code> as discovered by the running bridge. Run <code>npm run deepseek-harness:smoke</code> for F1–F10 boundary-contract verdicts.</p>
  <div class="controls">
    <button id="refresh">Refresh</button>
    <span class="meta" id="meta"></span>
  </div>
  <div id="root"></div>

  <script>
    const root = document.getElementById("root");
    const meta = document.getElementById("meta");
    const refresh = document.getElementById("refresh");

    function esc(s) {
      return String(s ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
    }

    function renderAddon(addon) {
      const card = document.createElement("div");
      card.className = "addon";

      const h2 = document.createElement("h2");
      h2.textContent = addon.name || addon.id || addon.fileName;
      card.appendChild(h2);

      const fileMeta = document.createElement("div");
      fileMeta.className = "meta";
      fileMeta.textContent = `${addon.fileName}${addon.version ? " · v" + addon.version : ""}`;
      card.appendChild(fileMeta);

      if (addon.error) {
        const err = document.createElement("div");
        err.className = "err";
        err.textContent = addon.error;
        card.appendChild(err);
        return card;
      }

      const rows = [
         ["id", addon.id],
        ["publisher", (addon.publisher || "(missing)") + (addon.publisherNote ? " (" + addon.publisherNote + ")" : "")],
        ["trust tier (ADR-042)", null],
        ["runtimeType", addon.runtimeType],
        ["service.entrypoint", addon.serviceEntrypoint || "(none)"],
        ["isolation.boundary (ADR-041)", addon.isolationBoundary || "(none)"],
        ["§3 trigger", addon.hasTrigger ? "providers + agent-delegation" : "—"],
        ["tools", (addon.tools || []).join(", ") || "—"],
      ];
      for (const [k, v] of rows) {
        const row = document.createElement("div");
        row.className = "row";
        if (v === null && k === "trust tier (ADR-042)") {
          const tier = addon.trustTier || "(unknown)";
          row.innerHTML = `<span class="k">${esc(k)}</span><span class="v"><span class="badge tier-${esc(tier)}">${esc(tier)}</span></span>`;
        } else {
          row.innerHTML = `<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`;
        }
        card.appendChild(row);
      }
      // Host-mediate badge + worker-key chip block below the rows.
      const badges = document.createElement("div");
      badges.className = "badges";
      const hostBadge = document.createElement("span");
      hostBadge.className = "badge " + (addon.hostMediated ? "host-mediate" : "host-inline");
      hostBadge.textContent = addon.hostMediated ? "host-mediated" : "in-process";
      badges.appendChild(hostBadge);
      card.appendChild(badges);
      const wk = document.createElement("div");
      wk.className = "worker-key";
      wk.innerHTML = `<span class="label">workerKey</span>${esc(addon.workerKey || "(n/a)")}`;
      card.appendChild(wk);

      if (addon.validationNote) {
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = addon.validationNote;
        card.appendChild(note);
      }

      return card;
    }

    async function load() {
      root.innerHTML = '<p class="meta">Loading...</p>';
      try {
        const headers = window.__BRIDGE_TOKEN__ ? { "X-ResonantOS-Bridge-Token": window.__BRIDGE_TOKEN__ } : {};
        const res = await fetch("/dev/external-agent-runtimes", { headers });
        if (!res.ok) {
          const text = await res.text();
          root.innerHTML = `<div class="err">HTTP ${res.status}: ${esc(text)}</div>`;
          meta.textContent = `last refresh failed`;
          return;
        }
        const data = await res.json();
        const addons = data?.body?.addons ?? [];
        root.innerHTML = "";
        if (addons.length === 0) {
          root.innerHTML = '<p class="meta">No addon manifests under examples/addons/.</p>';
        } else {
          for (const addon of addons) root.appendChild(renderAddon(addon));
        }
        meta.textContent = `generated at ${data?.body?.generatedAt ?? "?"} · ${addons.length} addon(s)`;
      } catch (err) {
        root.innerHTML = `<div class="err">Fetch failed: ${esc(err.message)}</div>`;
        meta.textContent = `last refresh failed`;
      }
    }

    refresh.addEventListener("click", load);
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>

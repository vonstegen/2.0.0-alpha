<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>G0-ROS Workbench — Dev Panel</title>
  <style>
    :root { color-scheme: light dark; --bg:#0e1116; --fg:#e6edf3; --muted:#8b949e; --ok:#3fb950; --warn:#d29922; --fail:#f85149; --card:#161b22; --border:#30363d; --accent:#58a6ff; }
    body { font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); margin:0; padding:24px; }
    h1 { margin:0 0 4px 0; font-size:22px; }
    h2 { margin:0 0 10px 0; font-size:15px; border-bottom:1px solid var(--border); padding-bottom:6px; }
    .subtitle { color:var(--muted); margin:0 0 20px 0; }
    .controls { display:flex; gap:8px; align-items:center; margin-bottom:16px; }
    button { font:inherit; padding:6px 12px; background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:6px; cursor:pointer; }
    button:hover { background:var(--border); }
    .meta { color:var(--muted); font-size:12px; }
    section { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
    .invariant { font-size:13px; color:var(--accent); border-left:2px solid var(--accent); padding-left:10px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--border); }
    .kv { display:grid; grid-template-columns:180px 1fr; gap:4px 12px; font-size:13px; }
    .kv .k { color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
    .cell { border:1px solid var(--border); border-radius:6px; padding:10px; font-size:12px; }
    .cell .t { font-weight:600; margin-bottom:2px; }
    .cell .d { color:var(--muted); }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    .sup { color:var(--warn); }
    .badge { display:inline-block; padding:1px 7px; border-radius:999px; font-size:10px; font-weight:700; border:1px solid var(--border); }
    .tier-personal { background:rgba(210,153,34,0.18); color:var(--warn); border-color:rgba(210,153,34,0.45); }
    .tier-verified { background:rgba(63,185,80,0.18); color:var(--ok); border-color:rgba(63,185,80,0.45); }
    .tier-approved { background:rgba(63,185,80,0.22); color:var(--ok); border-color:rgba(63,185,80,0.55); }
    .tier-system { background:rgba(110,118,129,0.30); color:var(--fg); border-color:rgba(110,118,129,0.55); }
    .untrusted { color:var(--warn); }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .err { color:var(--fail); }
  </style>
</head>
<body>
  <h1>G0-ROS Workbench</h1>
  <p class="subtitle">Dev-only panel. The ROS architecture blueprint (ADR-051) and how each discovered add-on maps onto the fused G0 core.</p>
  <div class="controls">
    <button id="refresh">Refresh</button>
    <span class="meta" id="meta"></span>
  </div>
  <div id="root"></div>

  <script>
    const root = document.getElementById("root");
    const meta = document.getElementById("meta");
    const refresh = document.getElementById("refresh");

    function esc(s) {
      return String(s ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
    }

    function section(title) {
      const el = document.createElement("section");
      const h = document.createElement("h2");
      h.textContent = title;
      el.appendChild(h);
      return el;
    }

    function renderArchitecture(arch) {
      if (!arch) return;

      const inv = section("Ground-0 invariant");
      const p = document.createElement("p");
      p.className = "invariant";
      p.textContent = arch.groundZeroInvariant || "";
      inv.appendChild(p);
      root.appendChild(inv);

      const core = section("Fused core (non-removable)");
      const chips = document.createElement("div");
      chips.className = "chips";
      for (const s of arch.fusedCore?.sections ?? []) {
        const c = document.createElement("span");
        c.className = "chip";
        c.textContent = s;
        chips.appendChild(c);
      }
      const kv = document.createElement("div");
      kv.className = "kv";
      const rows = [
        ["integratedHarness", arch.fusedCore?.integratedHarness],
        ["systemMemoryKind", arch.fusedCore?.systemMemoryKind],
        ["recoveryField", arch.fusedCore?.recoveryField]
      ];
      for (const [k, v] of rows) {
        kv.innerHTML += `<span class="k">${esc(k)}</span><span class="mono">${esc(v)}</span>`;
      }
      core.append(chips, document.createElement("div"), kv);
      root.appendChild(core);

      const scoping = section("Scoping hierarchy");
      const sg = document.createElement("div");
      sg.className = "grid";
      for (const [level, info] of Object.entries(arch.scoping ?? {})) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `<div class="t">${esc(level)}</div><div class="d">${esc(info?.owns)}</div>`;
        sg.appendChild(cell);
      }
      scoping.appendChild(sg);
      root.appendChild(scoping);

      const vocab = section("Vocabulary");
      const vg = document.createElement("div");
      vg.className = "grid";
      for (const [term, def] of Object.entries(arch.vocabulary ?? {})) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `<div class="t">${esc(term)}</div><div class="d">${esc(def)}</div>`;
        vg.appendChild(cell);
      }
      vocab.appendChild(vg);
      root.appendChild(vocab);

      const cat = section("Category blueprint (what an add-on is → rail destination)");
      const catGrid = document.createElement("div");
      catGrid.className = "grid";
      for (const [category, bp] of Object.entries(arch.categories ?? {})) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `<div class="t">${esc(category)} <span class="badge">${esc(bp?.railMenuKind)}</span></div><div class="d">${esc(bp?.definition)}</div>`;
        catGrid.appendChild(cell);
      }
      cat.appendChild(catGrid);
      root.appendChild(cat);

      const rt = section("Runtime type blueprint (how an add-on runs)");
      const rtGrid = document.createElement("div");
      rtGrid.className = "grid";
      for (const [runtimeType, bp] of Object.entries(arch.runtimeTypes ?? {})) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `<div class="t mono">${esc(runtimeType)}</div><div class="d">${esc(bp?.definition)}</div>`;
        rtGrid.appendChild(cell);
      }
      rt.appendChild(rtGrid);
      root.appendChild(rt);
    }

    function renderHarness(harness) {
      if (!harness) return;
      const el = section("G0 harness tool loop");
      const table = document.createElement("table");
      table.innerHTML = `<thead><tr><th>tool</th><th>domain</th><th>description</th><th>superseded by</th></tr></thead>`;
      const tbody = document.createElement("tbody");
      for (const tool of harness.nativeTools ?? []) {
        const tr = document.createElement("tr");
        const sup = tool.supersededBy
          ? `<span class="sup">${esc(tool.supersededBy.addonId)} → ${esc(tool.supersededBy.toolName)}</span>`
          : "—";
        tr.innerHTML = `<td class="mono">${esc(tool.name)}</td><td>${esc(tool.domain)}</td><td>${esc(tool.description)}</td><td>${sup}</td>`;
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      el.appendChild(table);
      root.appendChild(el);
    }

    function renderAddons(addons) {
      const el = section(`Add-ons (${addons.length} discovered)`);
      const table = document.createElement("table");
      table.innerHTML = `<thead><tr><th>id</th><th>category</th><th>rail</th><th>runtime</th><th>trust</th><th>tools</th></tr></thead>`;
      const tbody = document.createElement("tbody");
      for (const a of addons) {
        const tr = document.createElement("tr");
        const tier = a.trustTier || "unknown";
        const trustCell = `<span class="badge tier-${esc(tier)}">${esc(tier)}</span>` + (a.untrusted ? ` <span class="untrusted">⚠</span>` : "");
        const tools = (a.tools ?? []).map((t) => t.name + (t.coversNativeTool ? `→${t.coversNativeTool}` : "")).join(", ") || "—";
        tr.innerHTML = `
          <td class="mono">${esc(a.id)}<br><span class="meta">${esc(a.name)}${a.version ? " · v" + esc(a.version) : ""}</span></td>
          <td>${esc(a.category ?? "—")}</td>
          <td><span class="badge">${esc(a.railMenuKind)}</span></td>
          <td class="mono">${esc(a.runtimeType ?? "—")}</td>
          <td>${trustCell}</td>
          <td class="mono">${esc(tools)}</td>`;
        if (a.untrusted) {
          const notice = document.createElement("tr");
          notice.innerHTML = `<td colspan="6" class="untrusted">${esc(a.trustNotice || "Not tested or approved.")}</td>`;
          tbody.appendChild(tr);
          tbody.appendChild(notice);
        } else {
          tbody.appendChild(tr);
        }
      }
      table.appendChild(tbody);
      el.appendChild(table);
      root.appendChild(el);
    }

    async function load() {
      root.innerHTML = '<p class="meta">Loading...</p>';
      try {
        const headers = window.__BRIDGE_TOKEN__ ? { "X-ResonantOS-Bridge-Token": window.__BRIDGE_TOKEN__ } : {};
        const res = await fetch("/dev/g0-ros", { headers });
        if (!res.ok) {
          const text = await res.text();
          root.innerHTML = `<div class="err">HTTP ${res.status}: ${esc(text)}</div>`;
          meta.textContent = "last refresh failed";
          return;
        }
        const data = await res.json();
        const body = data?.body ?? data;
        root.innerHTML = "";
        renderArchitecture(body.architecture);
        renderHarness(body.harness);
        renderAddons(body.addons ?? []);
        meta.textContent = `generated at ${body.generatedAt ?? "?"} · ${(body.addons ?? []).length} add-on(s)`;
      } catch (err) {
        root.innerHTML = `<div class="err">Fetch failed: ${esc(err.message)}</div>`;
        meta.textContent = "last refresh failed";
      }
    }

    refresh.addEventListener("click", load);
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Resonant Counter — SDK Reference</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: #0d0f12;
        color: #e6e6e6;
        height: 100%;
      }
      .root {
        padding: 24px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      h1 { font-size: 18px; margin: 0; color: #f0c674; }
      .panel {
        background: #15181d;
        border: 1px solid #2a2e36;
        border-radius: 6px;
        padding: 16px;
      }
      .count {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 32px;
        color: #b5bd68;
        margin: 8px 0;
      }
      button {
        background: #2c313a;
        color: #e6e6e6;
        border: 1px solid #3a3f48;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        margin-right: 8px;
      }
      button:hover { background: #3a3f48; }
      .log {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: #969896;
        max-height: 180px;
        overflow-y: auto;
      }
      .log .ok { color: #b5bd68; }
      .log .err { color: #cc6666; }
    </style>
  </head>
  <body>
    <div class="root">
      <h1>Resonant Counter — SDK Reference #2</h1>

      <section class="panel" id="status">
        <div>Bridge identity: <code id="bridge-id">unknown</code></div>
        <div>Capability token: <code id="cap-token">unknown</code></div>
        <div>Upstream port: <code id="upstream-port">47422</code></div>
      </section>

      <section class="panel">
        <div class="count" id="count">0</div>
        <button id="inc">+1</button>
        <button id="read">Refresh</button>
      </section>

      <section class="panel">
        <h2 style="font-size:13px;margin:0 0 8px 0;color:#cc6666;">Cross-boundary log</h2>
        <div class="log" id="log"></div>
      </section>
    </div>
    <script type="module">
      // SDK-DEMO-002-FIX-2: the Counter loads cross-origin from its own
      // upstream origin (http://127.0.0.1:<port>/) inside a sandboxed
      // iframe (sandbox="allow-scripts allow-same-origin"). Its own
      // <script> executes (the historical srcdoc CSP gap is gone). API
      // calls go to the add-on's OWN origin via /api/counter/* (no CORS
      // because same-origin, no ACAO needed).
      //
      // Auth model:
      //   1. The extension's renderer mints the add-on's capability
      //      tokens via the bridge (POST /api/capability-tokens with
      //      bridge-token + capability-bootstrap-token).
      //   2. After the iframe loads, the parent delivers the bootstrap
      //      config via postMessage with targetOrigin = the add-on's
      //      own upstream origin. The payload is { type, apiBasePath,
      //      bridgeIdentity, capabilityTokens }. The bridge token is
      //      NEVER included.
      //   3. The add-on validates event.source === window.parent AND
      //      event.data.type === "resonantos-addon-bootstrap" before
      //      trusting the message.
      //   4. The add-on uses the harness-messaging capability token
      //      for every /api/<addon>/* call. The upstream enforces it.
      const log = document.getElementById("log");
      const countEl = document.getElementById("count");
      const bridgeIdEl = document.getElementById("bridge-id");
      const capTokenEl = document.getElementById("cap-token");
      let apiBasePath = "/api";
      let capabilityToken = "";
      let bootstrapped = false;

      function appendLog(level, text) {
        const entry = document.createElement("div");
        entry.className = level;
        const ts = new Date().toISOString().slice(11, 23);
        entry.textContent = `${ts} [${level}] ${text}`;
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
      }

      function applyBootstrap({ apiBasePath: declaredApi, bridgeIdentity, capabilityTokens }) {
        apiBasePath = String(declaredApi || "/api");
        if (bridgeIdentity) bridgeIdEl.textContent = bridgeIdentity;
        capabilityToken = String((capabilityTokens && capabilityTokens["harness-messaging"]) ?? "");
        if (capabilityToken) capTokenEl.textContent = capabilityToken.slice(0, 12) + "…";
        bootstrapped = true;
      }

      function awaitBootstrap() {
        // Wait for the parent's postMessage delivery. Validate
        // event.source AND event.data.type before trusting the
        // message.
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            window.removeEventListener("message", onMessage);
            reject(new Error("bootstrap timeout (no postMessage from parent)"));
          }, 15000);
          function onMessage(event) {
            if (event.source !== window.parent) return;
            const data = event.data;
            if (!data || typeof data !== "object") return;
            if (data.type !== "resonantos-addon-bootstrap") return;
            clearTimeout(timer);
            window.removeEventListener("message", onMessage);
            applyBootstrap(data);
            resolve(data);
          }
          window.addEventListener("message", onMessage);
        });
      }

      async function ensureBootstrap() {
        if (bootstrapped && capabilityToken) return true;
        try {
          await awaitBootstrap();
        } catch (err) {
          appendLog("err", String(err?.message ?? err));
          return false;
        }
        if (!capabilityToken) {
          appendLog("err", "no harness-messaging token in parent's bootstrap postMessage");
          return false;
        }
        return true;
      }

      async function call(method, path, body) {
        if (!await ensureBootstrap()) return null;
        const response = await fetch(`${apiBasePath.replace(/\/+$/, "")}${path}`, {
          method,
          headers: {
            "content-type": "application/json",
            "x-resonantos-bridge-capability-token": capabilityToken
          },
          body: body ? JSON.stringify(body) : undefined
        });
        const text = await response.text();
        let parsed = null;
        try { parsed = JSON.parse(text); } catch { parsed = { raw: text }; }
        if (!response.ok) {
          appendLog("err", `${method} ${path} → ${response.status} ${parsed?.error ?? ""}`);
          return null;
        }
        appendLog("ok", `${method} ${path} → ${response.status}`);
        return parsed;
      }
      async function refreshCount() {
        const read = await call("GET", "/read");
        if (read && typeof read.count === "number") {
          countEl.textContent = String(read.count);
        }
      }
      document.getElementById("inc").addEventListener("click", async () => {
        const result = await call("POST", "/increment", { delta: 1 });
        if (result && typeof result.count === "number") {
          countEl.textContent = String(result.count);
          if (result.bridgeIdentity) bridgeIdEl.textContent = result.bridgeIdentity;
          appendLog("ok", `count → ${result.count}`);
        }
      });
      document.getElementById("read").addEventListener("click", refreshCount);
      // Initial read so the counter reflects upstream state without clicking.
      refreshCount().then(() => {
        appendLog("ok", "Resonant Counter workspace booted (cross-origin sandboxed)");
      });
    </script>
  </body>
</html>
